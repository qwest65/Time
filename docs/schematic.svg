<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="560" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Часы-термометр на табло DIP4-70/485 — схема подключения</text>

  <!-- ===== DIP4-70 ===== -->
  <rect x="30" y="70" width="250" height="150" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="155" y="95" text-anchor="middle" font-weight="bold" fill="#1b5e20">Табло DIP4-70/485</text>
  <text x="155" y="140" text-anchor="middle" font-size="34" font-family="monospace" fill="#2e7d32">88.88</text>
  <text x="155" y="165" text-anchor="middle" font-size="12" fill="#555">адрес 1, RS-485 9600</text>
  <text x="268" y="116" text-anchor="end" fill="#222">A (1)</text>
  <text x="268" y="156" text-anchor="end" fill="#222">B (2)</text>
  <text x="45" y="200" fill="#222">+12V  GND</text>

  <!-- ===== RS485 ===== -->
  <rect x="380" y="70" width="170" height="160" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="465" y="62" text-anchor="middle" font-weight="bold" fill="#0d47a1">TTL ↔ RS485 (MAX485)</text>
  <text x="392" y="116" fill="#222">A</text>
  <text x="392" y="156" fill="#222">B</text>
  <text x="538" y="96" text-anchor="end" fill="#222">RO</text>
  <text x="538" y="126" text-anchor="end" fill="#222">RE</text>
  <text x="538" y="156" text-anchor="end" fill="#222">DE</text>
  <text x="538" y="186" text-anchor="end" fill="#222">DI</text>
  <text x="392" y="220" fill="#222">VCC  GND</text>

  <!-- A/B -->
  <line x1="280" y1="112" x2="380" y2="112" stroke="#6a1b9a" stroke-width="3"/>
  <line x1="280" y1="152" x2="380" y2="152" stroke="#ef6c00" stroke-width="3"/>
  <text x="330" y="105" text-anchor="middle" fill="#6a1b9a" font-size="12">A</text>
  <text x="330" y="170" text-anchor="middle" fill="#ef6c00" font-size="12">B</text>

  <!-- ===== Arduino ===== -->
  <rect x="680" y="60" width="190" height="440" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="775" y="285" text-anchor="middle" font-weight="bold" font-size="18" fill="#006064">Arduino</text>
  <text x="775" y="305" text-anchor="middle" fill="#006064">Nano / Uno</text>
  <!-- left pins -->
  <text x="692" y="96" fill="#222">D10</text>
  <text x="692" y="141" fill="#222">D3</text>
  <text x="692" y="186" fill="#222">D11</text>
  <text x="692" y="386" fill="#222">D12</text>
  <!-- right pins -->
  <text x="858" y="106" text-anchor="end" fill="#222">D2</text>
  <text x="858" y="226" text-anchor="end" fill="#222">A4 (SDA)</text>
  <text x="858" y="266" text-anchor="end" fill="#222">A5 (SCL)</text>
  <text x="858" y="406" text-anchor="end" fill="#222">5V</text>
  <text x="858" y="446" text-anchor="end" fill="#222">GND</text>
  <text x="858" y="486" text-anchor="end" fill="#222">VIN</text>

  <!-- RO -> D10 -->
  <line x1="550" y1="92" x2="680" y2="92" stroke="#c62828" stroke-width="2.5"/>
  <circle cx="680" cy="92" r="4" fill="#c62828"/>
  <!-- RE + DE -> D3 -->
  <polyline points="550,122 610,122 610,152 550,152" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <line x1="610" y1="137" x2="680" y2="137" stroke="#2e7d32" stroke-width="2.5"/>
  <circle cx="610" cy="137" r="4" fill="#2e7d32"/>
  <circle cx="680" cy="137" r="4" fill="#2e7d32"/>
  <text x="615" y="170" fill="#2e7d32" font-size="11">RE+DE вместе</text>
  <!-- DI -> D11 -->
  <line x1="550" y1="182" x2="680" y2="182" stroke="#1565c0" stroke-width="2.5"/>
  <circle cx="680" cy="182" r="4" fill="#1565c0"/>

  <!-- ===== Button D12 ===== -->
  <line x1="680" y1="382" x2="600" y2="382" stroke="#333" stroke-width="2.5"/>
  <circle cx="680" cy="382" r="4" fill="#333"/>
  <line x1="600" y1="382" x2="600" y2="410" stroke="#333" stroke-width="2.5"/>
  <!-- switch symbol -->
  <circle cx="600" cy="414" r="4" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="600" cy="454" r="4" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="592" y1="420" x2="580" y2="450" stroke="#333" stroke-width="2.5"/>
  <line x1="570" y1="434" x2="586" y2="434" stroke="#333" stroke-width="2"/>
  <line x1="600" y1="458" x2="600" y2="485" stroke="#333" stroke-width="2.5"/>
  <line x1="585" y1="485" x2="615" y2="485" stroke="#333" stroke-width="2.5"/>
  <line x1="590" y1="491" x2="610" y2="491" stroke="#333" stroke-width="2"/>
  <line x1="595" y1="497" x2="605" y2="497" stroke="#333" stroke-width="2"/>
  <text x="520" y="430" text-anchor="end" fill="#222" font-weight="bold">Кнопка</text>
  <text x="520" y="448" text-anchor="end" fill="#555" font-size="12">подводка времени</text>
  <text x="620" y="500" fill="#555" font-size="12">GND</text>

  <!-- ===== DS18B20 ===== -->
  <rect x="960" y="60" width="140" height="100" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="1030" y="85" text-anchor="middle" font-weight="bold" fill="#bf360c">DS18B20</text>
  <text x="972" y="106" fill="#222">DQ</text>
  <text x="972" y="128" fill="#222">VCC → 5V</text>
  <text x="972" y="148" fill="#222">GND</text>
  <line x1="870" y1="102" x2="960" y2="102" stroke="#e65100" stroke-width="2.5"/>
  <circle cx="870" cy="102" r="4" fill="#e65100"/>
  <!-- pull-up resistor -->
  <circle cx="915" cy="102" r="4" fill="#e65100"/>
  <line x1="915" y1="102" x2="915" y2="125" stroke="#e65100" stroke-width="2"/>
  <rect x="908" y="125" width="14" height="34" fill="#fff" stroke="#e65100" stroke-width="2"/>
  <line x1="915" y1="159" x2="915" y2="180" stroke="#e65100" stroke-width="2"/>
  <text x="928" y="146" fill="#e65100" font-size="12">4.7k</text>
  <text x="915" y="195" text-anchor="middle" fill="#e65100" font-size="12">+5V</text>

  <!-- ===== DS3231 ===== -->
  <rect x="960" y="200" width="140" height="110" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="1030" y="222" text-anchor="middle" font-weight="bold" fill="#4a148c">DS3231 (RTC)</text>
  <text x="972" y="226" fill="#222"></text>
  <text x="972" y="248" fill="#222">SDA</text>
  <text x="972" y="270" fill="#222">SCL</text>
  <text x="972" y="296" fill="#222">VCC 5V, GND</text>
  <polyline points="870,222 930,222 930,244 960,244" fill="none" stroke="#6a1b9a" stroke-width="2.5"/>
  <polyline points="870,262 930,262 930,266 960,266" fill="none" stroke="#8e24aa" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="870" cy="222" r="4" fill="#6a1b9a"/>
  <circle cx="870" cy="262" r="4" fill="#8e24aa"/>

  <!-- ===== Power ===== -->
  <rect x="960" y="380" width="140" height="80" rx="6" fill="#ffebee" stroke="#b71c1c" stroke-width="2"/>
  <text x="1030" y="405" text-anchor="middle" font-weight="bold" fill="#b71c1c">БП 12V</text>
  <text x="972" y="430" fill="#222">+12V</text>
  <text x="972" y="450" fill="#222">GND</text>
  <polyline points="960,426 920,426 920,482 870,482" fill="none" stroke="#b71c1c" stroke-width="2.5"/>
  <circle cx="870" cy="482" r="4" fill="#b71c1c"/>
  <polyline points="960,446 940,446 940,442 870,442" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="870" cy="442" r="4" fill="#000"/>

  <!-- ===== Notes ===== -->
  <rect x="30" y="520" width="1070" height="105" rx="6" fill="#fafafa" stroke="#bbb"/>
  <text x="45" y="545" fill="#222" font-weight="bold">Питание и общие цепи:</text>
  <text x="45" y="567" fill="#222">• +12V БП → «+» табло DIP4-70 (9…12 В) и VIN Arduino. GND БП → GND табло и GND Arduino — земля должна быть ОБЩЕЙ.</text>
  <text x="45" y="589" fill="#222">• 5V Arduino → VCC модуля RS485, DS3231, DS18B20 (и верх резистора 4.7k). GND всех модулей → GND Arduino.</text>
  <text x="45" y="611" fill="#222">• Если табло показывает «----», поменяйте местами провода A и B.</text>
</svg>
